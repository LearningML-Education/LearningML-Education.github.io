name: Deploy Astro site

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check public URL envs
        env:
          PUBLIC_LML_OPEN_EDITOR_URL: ${{ vars.PUBLIC_LML_OPEN_EDITOR_URL || secrets.PUBLIC_LML_OPEN_EDITOR_URL }}
          PUBLIC_LML_OPEN_SCRATCH_URL: ${{ vars.PUBLIC_LML_OPEN_SCRATCH_URL || secrets.PUBLIC_LML_OPEN_SCRATCH_URL }}
          PUBLIC_LML_DESKTOP_URL: ${{ vars.PUBLIC_LML_DESKTOP_URL || secrets.PUBLIC_LML_DESKTOP_URL }}
          PUBLIC_LML_BUDGET_CURRENT: ${{ vars.PUBLIC_LML_BUDGET_CURRENT || secrets.PUBLIC_LML_BUDGET_CURRENT }}
          PUBLIC_LML_MONTHLY_COST: ${{ vars.PUBLIC_LML_MONTHLY_COST || secrets.PUBLIC_LML_MONTHLY_COST }}
          PUBLIC_LML_BUDGET_ORIGIN_DATE: ${{ vars.PUBLIC_LML_BUDGET_ORIGIN_DATE || secrets.PUBLIC_LML_BUDGET_ORIGIN_DATE }}
        run: |
          test -n "$PUBLIC_LML_OPEN_EDITOR_URL" && echo "OPEN_EDITOR_URL: set" || echo "OPEN_EDITOR_URL: empty"
          test -n "$PUBLIC_LML_OPEN_SCRATCH_URL" && echo "OPEN_SCRATCH_URL: set" || echo "OPEN_SCRATCH_URL: empty"
          test -n "$PUBLIC_LML_DESKTOP_URL" && echo "DESKTOP_URL: set" || echo "DESKTOP_URL: empty"
          test -n "$PUBLIC_LML_BUDGET_CURRENT" && echo "BUDGET_CURRENT: set" || echo "BUDGET_CURRENT: empty"
          test -n "$PUBLIC_LML_MONTHLY_COST" && echo "MONTHLY_COST: set" || echo "MONTHLY_COST: empty"
          test -n "$PUBLIC_LML_BUDGET_ORIGIN_DATE" && echo "BUDGET_ORIGIN_DATE: set" || echo "BUDGET_ORIGIN_DATE: empty"

      - name: Build
        env:
          PUBLIC_LML_OPEN_EDITOR_URL: ${{ vars.PUBLIC_LML_OPEN_EDITOR_URL || secrets.PUBLIC_LML_OPEN_EDITOR_URL }}
          PUBLIC_LML_OPEN_SCRATCH_URL: ${{ vars.PUBLIC_LML_OPEN_SCRATCH_URL || secrets.PUBLIC_LML_OPEN_SCRATCH_URL }}
          PUBLIC_LML_DESKTOP_URL: ${{ vars.PUBLIC_LML_DESKTOP_URL || secrets.PUBLIC_LML_DESKTOP_URL }}
          PUBLIC_LML_BUDGET_CURRENT: ${{ vars.PUBLIC_LML_BUDGET_CURRENT || secrets.PUBLIC_LML_BUDGET_CURRENT }}
          PUBLIC_LML_MONTHLY_COST: ${{ vars.PUBLIC_LML_MONTHLY_COST || secrets.PUBLIC_LML_MONTHLY_COST }}
          PUBLIC_LML_BUDGET_ORIGIN_DATE: ${{ vars.PUBLIC_LML_BUDGET_ORIGIN_DATE || secrets.PUBLIC_LML_BUDGET_ORIGIN_DATE }}
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
